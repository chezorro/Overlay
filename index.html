<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-shadow-box {
      width: 100%;
      /* Wymiary środkowego okna gry (dla 16:9 na szerokość 1080px to 607.5px) */
      aspect-ratio: 16 / 9;
      background: transparent;
      
      /* Cień rzucany symetrycznie w górę i w dół */
      box-shadow: 
        0 -15px 30px rgba(0, 0, 0, 0.45), /* cień nad grą */
        0  15px 30px rgba(0, 0, 0, 0.45);  /* cień pod grą */
    }
  </style>
</head>
<body>
  <div class="game-shadow-box"></div>
</body>
</html>
