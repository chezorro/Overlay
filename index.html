<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    .gradient-bar {
      width: 1080px;
      height: 40px; /* Dokładna wysokość gradientu */
background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.22) 30%,
        rgba(0, 0, 0, 0.10) 65%,
        rgba(0, 0, 0, 0.02) 88%,
        rgba(0, 0, 0, 0) 100%
      );
    }
  </style>
</head>
<body>
  <div class="gradient-bar"></div>
</body>
</html>
