<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-shadow-box {
      width: 100%;
      /* Dokładne proporcje okna 16:10 (np. 1920x1200, 1680x1050, 1280x800) */
      aspect-ratio: 16 / 10;
      background: transparent;
      
      /* Cień rzucany nad grę i pod grę */
      box-shadow: 
        0 -10px 25px rgba(0, 0, 0, 0.40), /* góra */
        0  10px 25px rgba(0, 0, 0, 0.40);  /* dół */
    }
  </style>
</head>
<body>
  <div class="game-shadow-box"></div>
</body>
</html>
